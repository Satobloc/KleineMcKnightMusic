name: KMcKM Workbench Command

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  parse-command:
    if: startsWith(github.event.issue.title, '[workbench]') && github.event.issue.user.login == 'Satobloc'
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.parse.outputs.command }}
      lyrics_chars: ${{ steps.parse.outputs.lyrics_chars }}
      styles_chars: ${{ steps.parse.outputs.styles_chars }}
      seed: ${{ steps.parse.outputs.seed }}
    steps:
      - id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os
          payload = json.loads(os.environ.get("ISSUE_BODY", ""))
          command = payload.get("command")
          if command not in {"hopper-trial", "well-fuck-corpus-acquire"}:
              raise SystemExit("Unsupported command.")
          lines = [f"command={command}"]
          if command == "hopper-trial":
              lyrics = int(payload.get("lyrics_chars", 1800))
              styles = int(payload.get("styles_chars", 500))
              if not (1 <= lyrics <= 5000 and 1 <= styles <= 1000):
                  raise SystemExit("Character limits outside allowed range.")
              lines.extend([f"lyrics_chars={lyrics}", f"styles_chars={styles}"])
              if payload.get("seed") is not None:
                  lines.append(f"seed={int(payload['seed'])}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

  run-hopper:
    needs: parse-command
    if: needs.parse-command.outputs.command == 'hopper-trial'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out prototype code
        uses: actions/checkout@v4
        with:
          ref: prototype/hopper-trial
      - name: Fetch current corpus from main
        run: |
          git fetch origin main --depth=1
          mkdir -p corpus
          git archive FETCH_HEAD corpus | tar -x
      - name: Run compiler tests
        run: python -m unittest discover -s tests -p "test_random_hopper_compiler.py" -v
      - name: Compile selected music hoppers
        shell: bash
        run: |
          args=(--corpus corpus --out hopper_pulls --include-hoppers "Genre_Hopper,Structure_Hopper,Prompt_Hopper,Prompt_Examples_Hopper,Lyrics_Hopper" --lyrics-chars "${{ needs.parse-command.outputs.lyrics_chars }}" --styles-chars "${{ needs.parse-command.outputs.styles_chars }}")
          if [[ -n "${{ needs.parse-command.outputs.seed }}" ]]; then args+=(--seed "${{ needs.parse-command.outputs.seed }}"); fi
          python SUNO_WORKDESKS/SUNO_LLM_WORKSHOP_v0.1/tools/random_hopper_compiler.py "${args[@]}"
      - name: Upload workbench outputs
        uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ github.event.issue.number }}-${{ github.run_number }}
          path: hopper_pulls/
          if-no-files-found: error
          retention-days: 7

  run-well-fuck-corpus-acquire:
    needs: parse-command
    if: needs.parse-command.outputs.command == 'well-fuck-corpus-acquire'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire and verify approved corpus archives
        run: |
          python SIMULATION_WORKDESKS/WELL_FUCK/tools/acquire_language_corpora.py \
            --manifest SIMULATION_WORKDESKS/WELL_FUCK/data/corpora/source_manifest.json \
            --out SIMULATION_WORKDESKS/WELL_FUCK/data/corpora/incoming
      - name: Upload Well, Fuck corpus intake
        uses: actions/upload-artifact@v4
        with:
          name: well-fuck-corpus-intake-${{ github.event.issue.number }}-${{ github.run_number }}
          path: SIMULATION_WORKDESKS/WELL_FUCK/data/corpora/incoming/
          if-no-files-found: error
          retention-days: 30
