name: KMcKM Workbench

on:
  push:
    branches: [main, "workbench/**"]
    paths:
      - ".workbench/REQUEST.json"
      - ".github/workflows/workbench.yml"
      - "tools/workbench.py"
      - "SUNO_WORKDESKS/SUNO_LLM_WORKSHOP_v0.1/tools/random_hopper_compiler.py"
      - "tests/test_workbench.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmckm-workbench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip workbench]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workbench
        run: |
          python -m py_compile tools/workbench.py
          python -m unittest discover -s tests -p "test_workbench.py" -v
      - name: Run request
        id: run
        run: |
          python tools/workbench.py
          echo "output=$(python -c 'import json,pathlib; p=json.loads(pathlib.Path(".workbench/REQUEST.json").read_text()); print("workbench_runs/"+p["request_id"])')" >> "$GITHUB_OUTPUT"
      - name: Upload workbench result
        uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ github.run_number }}
          path: ${{ steps.run.outputs.output }}/
          if-no-files-found: error
          retention-days: 14
