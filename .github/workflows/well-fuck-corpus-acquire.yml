name: Well, Fuck. Corpus Acquisition

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: well-fuck-corpus-acquisition
  cancel-in-progress: false

jobs:
  validate-issue-command:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - id: check
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          python - <<'PY'
          import json, os
          if os.environ["ISSUE_AUTHOR"] != "Satobloc":
              raise SystemExit("Issue command not authorized.")
          if not os.environ["ISSUE_TITLE"].startswith("[workbench]"):
              raise SystemExit("Issue title must begin with [workbench].")
          payload = json.loads(os.environ["ISSUE_BODY"])
          if payload.get("command") != "well-fuck-corpus-acquire":
              raise SystemExit("Unsupported command.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("valid=true\n")
          PY

  acquire:
    needs: [validate-issue-command]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.validate-issue-command.outputs.valid == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire and verify approved corpus archives
        run: |
          python SIMULATION_WORKDESKS/WELL_FUCK/tools/acquire_language_corpora.py \
            --manifest SIMULATION_WORKDESKS/WELL_FUCK/data/corpora/source_manifest.json \
            --out SIMULATION_WORKDESKS/WELL_FUCK/data/corpora/incoming

      - name: Upload original archives and acquisition report
        uses: actions/upload-artifact@v4
        with:
          name: well-fuck-language-corpus-intake-${{ github.run_number }}
          path: SIMULATION_WORKDESKS/WELL_FUCK/data/corpora/incoming/
          if-no-files-found: error
          retention-days: 30
