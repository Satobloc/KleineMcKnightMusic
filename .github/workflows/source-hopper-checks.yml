name: Source Hopper Checks

on:
  push:
    paths:
      - "tools/source_hopper.py"
      - "tests/**"
      - ".github/workflows/source-hopper-checks.yml"
  pull_request:
    paths:
      - "tools/source_hopper.py"
      - "tests/**"
      - ".github/workflows/source-hopper-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-source-hopper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source hopper
        run: python -m py_compile tools/source_hopper.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
