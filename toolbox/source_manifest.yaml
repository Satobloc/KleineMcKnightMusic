schema_version: 1
manifest_date: "2026-11-01"
policy:
  - "A source being present in this manifest does not grant permission to republish it."
  - "Preserve original user artifacts verbatim in a private working corpus."
  - "Only move material into the public repository after authorship, provenance, license, and privacy review."
  - "Record software-code licenses separately from model-weight, dataset, sample, and generated-output terms."

external_sources:
  - id: audiocraft
    url: "https://github.com/facebookresearch/audiocraft"
    source_type: software_repository
    reviewed_material: ["README.md", "LICENSE"]
    license_summary: "Code MIT; repository model weights stated as CC-BY-NC 4.0."
    review_scope: "README and license review, not dependency or model audit."

  - id: bark
    url: "https://github.com/suno-ai/bark"
    source_type: software_repository
    reviewed_material: ["README.md", "LICENSE"]
    license_summary: "MIT code; upstream README describes pretrained checkpoints as available for commercial use."
    review_scope: "README and license review."

  - id: rvc
    url: "https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI"
    source_type: software_repository
    reviewed_material: ["README.md", "LICENSE"]
    license_summary: "MIT code; training data, model weights, and voice rights are separate."
    review_scope: "README and license review."

  - id: demucs
    url: "https://github.com/facebookresearch/demucs"
    source_type: software_repository
    reviewed_material: ["README.md", "LICENSE"]
    license_summary: "MIT code."
    maintenance_note: "Repository archived; README says it is no longer maintained."
    review_scope: "README and license review."

  - id: pedalboard
    url: "https://github.com/spotify/pedalboard"
