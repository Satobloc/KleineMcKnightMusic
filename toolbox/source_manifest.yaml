user_supplied_sources:
  - id: bigmoosik
    filename: "BIGMOOSIK.txt"
    source_type: user_authored_mixed_document
    contains:
      - "Drum-tab converter prototype"
      - "CODEWALKER chord path prototype"
      - "Song sketches and lyrics"
    privacy: "Private working corpus."
    publication: "Not authorized."
    next_action: "Extract relevant code unchanged for audit; keep unrelated personal material private."

  - id: sonic_pi_environment
    filename: "SONIC_PI_environment_rules.txt"
    source_type: user_authored_environment_notes
    contains: ["Windows 10 22H2 baseline", "Sonic Pi 4.5.1 (8oh8)", "operational notes"]
    privacy: "Private source; derived environment profile may be published after review."
    publication: "Do not copy wholesale."

  - id: sonic_pi_cheatsheets
    filename: "SONIC PI CHEATSHEETS.txt"
    source_type: user_authored_reference_compilation
    contains: ["Sonic Pi syntax and examples", "synth and effect references", "randomization and timing"]
    privacy: "Private working corpus."
    publication: "Verify and rewrite original documentation-derived material with attribution before publication."

  - id: songplay
    filename: "SONGPLAY.txt"
    source_type: user_authored_prompt_experiment
    contains: ["Original Suno prompt syntax", "section and layer cues", "rhythmic syllable patterns"]
    privacy: "Private working corpus."
    publication: "Preserve exact source; publish only after user approval."

  - id: good_song_experiments
    filename: "GOODSONG EXPERIMENTS.txt"
    source_type: user_authored_experiment_log
    contains: ["Prompts and outputs marked as successful"]
    privacy: "Private working corpus."
    publication: "Need prompt/output/settings linkage and rights review."

  - id: genrelab
    filename: "GENRELAB — raw(1).txt"
    source_type: conversation_export
    contains: ["Genrebuild iterations", "prompt grammar", "genre and tradition vocabulary", "user hypotheses"]
    privacy: "Private conversation export."
    publication: "Do not publish raw conversation; extract attributed user-authored concepts selectively."

  - id: file_set_overview
    filename: "File Set Overview — raw(1).txt"
    source_type: conversation_export
    contains: ["Music history", "audio experiments", "Suno prompting observations"]
    privacy: "Private conversation export."
    publication: "Do not publish raw conversation; extract relevant user-authored observations selectively."

  - id: geneclect_terminology
    filename: "geneclect_terminology_corpus.csv"
    source_type: user_compiled_terminology_corpus
    contains: ["304 working terminology entries"]
    privacy: "Working research corpus."
    publication: "Not yet approved; verify terms, descriptions, and sources."

  - id: reference_tracks
    filename: "TOP SONGS 2017-20.txt"
    source_type: user_reference_track_list
    contains: ["Track and artist references"]
    privacy: "Private preference/research material."
    publication: "Do not republish copyrighted lyrics, audio, or unlicensed descriptive text."

  - id: lyric_and_prose_materials
    filenames:
      - "23 amanda lyrics.txt"
      - "songsketch.txt"
      - "melodywork.txt"
      - "LYRIC_MINE.txt"
      - "QUIPS.txt"
    source_type: user_authored_or_mixed_creative_material
    privacy: "Private."
    publication: "Do not publish by default. LYRIC_MINE requires source and copyright/public-domain review."

  - id: unrelated_creative_material
    filenames:
      - "McKnight Sentencewise.txt"
    source_type: creative_writing_material
    privacy: "Private and outside the core music toolbox."
    publication: "Keep separate unless explicitly connected to the music project."
